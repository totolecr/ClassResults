[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "classresults"
dynamic = ["version"]
description = 'Gets student traces from operator and create an xlxs file.'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Thomas Bobee", email = "thomas.bobee@epita.fr" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Thomas Bobee/classresults#readme"
Issues = "https://github.com/Thomas Bobee/classresults/issues"
Source = "https://github.com/Thomas Bobee/classresults"

[tool.hatch.version]
path = "src/classresults/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/classresults tests}"

[tool.coverage.run]
source_pkgs = ["classresults", "tests"]
branch = true
parallel = true
omit = [
  "src/classresults/__about__.py",
]

[tool.coverage.paths]
classresults = ["src/classresults", "*/classresults/src/classresults"]
tests = ["tests", "*/classresults/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]


[tool.hatch.build.targets.wheel]
packages = ["src/classresults"]